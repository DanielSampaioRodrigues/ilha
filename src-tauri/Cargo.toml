[package]
name = "ilha"
version = "0.1.0"
description = "Ilha: central de IA e copiloto do computador"
authors = ["Daniel Sampaio Rodrigues"]
edition = "2021"

[lib]
name = "ilha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
tauri-plugin-store = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
log = "0.4"
base64 = "0.22"
sysinfo = "0.40"
pdf-extract = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
toml_edit = "0.25"
reqwest = { version = "0.13", features = ["json"] }
minisign-verify = "0.3"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }
libloading = "0.8"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-clipboard-manager = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Ouvido próprio: entende a fala no próprio PC (whisper.cpp).
whisper-rs = "0.16"
# Ouvido na nuvem (ElevenLabs em tempo real, por WebSocket).
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["sync", "macros", "time", "rt"] }
rustls = "0.23"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7"

[target.'cfg(windows)'.dependencies]
xcap = "0.9"
# Grava o microfone (WASAPI) para o ouvido próprio.
cpal = "0.18"
windows-future = "0.3"
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Control",
    "Media_Ocr",
    "Media_SpeechRecognition",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
