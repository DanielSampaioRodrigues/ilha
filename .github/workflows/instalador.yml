# Gera o instalador da Ilha para Windows a cada atualização.
# - Em qualquer ramo: o instalador fica em "Actions" > execução > "Artifacts".
# - No ramo main: também vira uma versão em "Releases". A Ilha instalada procura
#   ali o arquivo latest.json para saber se há versão nova (botão "Atualizar").
#
# A versão é 0.1.<número da execução>, então cada compilação é sempre "mais nova".
# A atualização automática precisa do segredo TAURI_SIGNING_PRIVATE_KEY no GitHub
# (Settings > Secrets and variables > Actions). Sem ele, o instalador sai normal,
# só não dá para atualizar pelo botão.
name: Instalador do Windows

on:
  push:
  workflow_dispatch:

concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSAO: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            CONFIG="{\"version\":\"$VERSAO\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          else
            echo "::warning::Sem o segredo TAURI_SIGNING_PRIVATE_KEY: o botão Atualizar não vai funcionar nesta versão."
            CONFIG="{\"version\":\"$VERSAO\"}"
          fi
          npx tauri build --bundles nsis --config "$CONFIG"

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Ilha-${{ env.VERSAO }}-instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Preparar latest.json (só no main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          PASTA=src-tauri/target/release/bundle/nsis
          INSTALADOR="Ilha_${VERSAO}_x64-setup.exe"
          if [ -f "$PASTA/$INSTALADOR.sig" ]; then
            node -e '
              const fs = require("fs");
              const [pasta, instalador, versao, repo] = process.argv.slice(1);
              fs.writeFileSync(`${pasta}/latest.json`, JSON.stringify({
                version: versao,
                pub_date: new Date().toISOString(),
                platforms: {
                  "windows-x86_64": {
                    signature: fs.readFileSync(`${pasta}/${instalador}.sig`, "utf8"),
                    url: `https://github.com/${repo}/releases/download/v${versao}/${instalador}`,
                  },
                },
              }, null, 2));
            ' "$PASTA" "$INSTALADOR" "$VERSAO" "$GITHUB_REPOSITORY"
          fi

      - name: Publicar versão (só no main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: Ilha ${{ env.VERSAO }}
          body: Instalador gerado automaticamente a partir de ${{ github.sha }}.
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/latest.json
